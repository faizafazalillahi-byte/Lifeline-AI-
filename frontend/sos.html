<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raise SOS — LifeLine AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/sos.css" />
<link rel="stylesheet" href="css/fakecall.css" />
</head>
<body class="sos-page">

<div class="sos-topbar">
  <a href="user_dashboard.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to Dashboard
  </a>
  <span class="brand" style="font-size:16px;">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path class="pulse-line" d="M2 16 H10 L13 6 L18 26 L21 16 H30" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    LifeLine AI
  </span>
</div>

<div class="sos-center">

  <!-- Pre-trigger setup -->
  <div id="sos-setup">
    <h1>Raise an Emergency SOS</h1>
    <p class="sub">Select what's happening, then press and hold — one tap shares your live location instantly.</p>

    <div class="type-chip-row">
      <button class="type-chip selected" data-type="medical">Medical</button>
      <button class="type-chip" data-type="fire">Fire</button>
      <button class="type-chip" data-type="accident">Accident</button>
      <button class="type-chip" data-type="crime">Crime</button>
      <button class="type-chip" data-type="other">Other</button>
    </div>

    <textarea id="sos-description" placeholder="Optional: briefly describe what's happening (e.g. 'car accident, someone injured')"></textarea>

    <div class="sos-button-wrap">
      <div class="sos-ripple r1"></div>
      <div class="sos-ripple r2"></div>
      <div class="sos-ripple r3"></div>
      <button id="sos-button">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        <span class="sos-label">SOS</span>
        <span class="sos-sub">Tap to alert</span>
      </button>
    </div>

    <div class="gps-status">
      <span class="gps-dot" id="gps-dot"></span>
      <span id="gps-status-text">Waiting for location permission...</span>
    </div>
  </div>

  <!-- Post-trigger result -->
  <div id="sos-result">
    <div class="result-header">
      <div class="status-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <h2>Help is on the way</h2>
      <p>Your location and severity assessment have been dispatched.</p>
    </div>

    <div class="result-badges" id="result-badges"></div>
    <div class="fake-alert-notice" id="fake-alert-notice"></div>

    <div class="first-aid-box" id="first-aid-guidance"></div>

    <div id="sos-map"></div>

    <div class="facility-cards">
      <div class="facility-card" id="hospital-card"></div>
      <div class="facility-card" id="police-card"></div>
    </div>

    <div class="result-actions">
      <a href="user_dashboard.html" class="btn btn-outline" style="color:#fff;border-color:var(--ink-600);">Return to Dashboard</a>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/map.js"></script>
<script src="js/sos.js"></script>
<script src="js/fakecall.js"></script>
</body>
</html>
